version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: idps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idps_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-idps_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idps -d idps_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  suricata:
    image: jasonish/suricata:latest
    container_name: idps-suricata
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_NICE
      - NET_RAW
    volumes:
      - suricata_logs:/var/log/suricata
      - ./infra/suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./infra/suricata/local.rules:/var/lib/suricata/rules/local.rules:ro
    command: -c /etc/suricata/suricata.yaml -i any

  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: idps-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-idps}:${POSTGRES_PASSWORD:-idps_secure_password}@postgres:5432/${POSTGRES_DB:-idps_db}
      - SECRET_KEY=${SECRET_KEY:-super_secret_jwt_key_idps_production_change_me}
      - ENVIRONMENT=production
      - SURICATA_EVE_PATH=/var/log/suricata/eve.json
      - DEMO_MODE=${DEMO_MODE:-true}
    volumes:
      - suricata_logs:/var/log/suricata:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: idps-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  suricata_logs:
